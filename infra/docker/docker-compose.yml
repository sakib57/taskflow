version: '3.9'

networks:
  taskflow:
    driver: bridge

volumes:
  postgres_auth_data:
  postgres_user_data:
  postgres_task_data:
  mongo_notification_data:
  redis_data:
  rabbitmq_data:
  elasticsearch_data:
  adminer_data:
  kong_data:

services:
  # ============================================
  # PostgreSQL Databases (per service)
  # ============================================
  postgres-auth:
    image: postgres:16-alpine
    container_name: taskflow-postgres-auth
    environment:
      POSTGRES_USER: taskflow
      POSTGRES_PASSWORD: taskflow_secret
      POSTGRES_DB: auth_db
    ports:
      - '5433:5432'
    volumes:
      - postgres_auth_data:/var/lib/postgresql/data
    networks:
      - taskflow
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U taskflow']
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-user:
    image: postgres:16-alpine
    container_name: taskflow-postgres-user
    environment:
      POSTGRES_USER: taskflow
      POSTGRES_PASSWORD: taskflow_secret
      POSTGRES_DB: user_db
    ports:
      - '5434:5432'
    volumes:
      - postgres_user_data:/var/lib/postgresql/data
    networks:
      - taskflow
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U taskflow']
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-task:
    image: postgres:16-alpine
    container_name: taskflow-postgres-task
    environment:
      POSTGRES_USER: taskflow
      POSTGRES_PASSWORD: taskflow_secret
      POSTGRES_DB: task_db
    ports:
      - '5435:5432'
    volumes:
      - postgres_task_data:/var/lib/postgresql/data
    networks:
      - taskflow
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U taskflow']
      interval: 10s
      timeout: 5s
      retries: 5
  # ============================================
  # MongoDB (Notifications + future services)
  # ============================================
  mongodb-notification:
    image: mongo:7
    container_name: taskflow-mongodb-notification
    environment:
      MONGO_INITDB_ROOT_USERNAME: taskflow
      MONGO_INITDB_ROOT_PASSWORD: taskflow_mongo
      MONGO_INITDB_DATABASE: notification_db
    ports:
      - '27018:27017'
    volumes:
      - mongo_notification_data:/data/db
    networks:
      - taskflow
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # Redis
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: taskflow-redis
    command: redis-server --appendonly yes --requirepass taskflow_redis
    ports:
      - '6380:6379'
    volumes:
      - redis_data:/data
    networks:
      - taskflow

  # ============================================
  # RabbitMQ
  # ============================================
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: taskflow-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: taskflow
      RABBITMQ_DEFAULT_PASS: taskflow_rabbit
      RABBITMQ_DEFAULT_VHOST: taskflow
    ports:
      - '5673:5672'
      - '15673:15672'
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - taskflow
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 30s
      timeout: 10s
      retries: 5

  # ============================================
  # Elasticsearch (Search)
  # ============================================
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: taskflow-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - 'ES_JAVA_OPTS=-Xms512m -Xmx512m'
    ports:
      - '9200:9200'
      - '9300:9300'
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - taskflow
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'curl -fs http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s || exit 1',
        ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s

  # ============================================
  # Kibana (Elasticsearch UI)
  # ============================================
  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    container_name: taskflow-kibana
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - '5601:5601'
    networks:
      - taskflow
    depends_on:
      elasticsearch:
        condition: service_healthy

  # ============================================
  # Adminer (PostgreSQL UI)
  # ============================================
  adminer:
    image: adminer:latest
    container_name: taskflow-adminer
    ports:
      - '8081:8080'
    environment:
      ADMINER_DEFAULT_SERVER: postgres-task
    networks:
      - taskflow
    depends_on:
      - postgres-auth
      - postgres-user
      - postgres-task
  # ============================================
  # Mongo Express (MongoDB UI)
  # ============================================
  mongo-express:
    image: mongo-express:latest
    container_name: taskflow-mongo-express
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: taskflow
      ME_CONFIG_MONGODB_ADMINPASSWORD: taskflow_mongo
      ME_CONFIG_MONGODB_URL: mongodb://taskflow:taskflow_mongo@mongodb-notification:27017/
      ME_CONFIG_BASICAUTH: false
    ports:
      - '8082:8081'
    networks:
      - taskflow
    depends_on:
      - mongodb-notification

  # ============================================
  # Kong API Gateway
  # ============================================
  kong-database:
    image: postgres:9.6-alpine
    container_name: taskflow-kong-db
    environment:
      POSTGRES_USER: kong
      POSTGRES_DB: kong
      POSTGRES_PASSWORD: kong_secret
    volumes:
      - kong_data:/var/lib/postgresql/data
    networks:
      - taskflow
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'kong']
      interval: 10s
      timeout: 5s
      retries: 5

  kong-migrations:
    image: kong:3.6
    container_name: taskflow-kong-migrations
    command: 'kong migrations bootstrap'
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-database
      KONG_PG_USER: kong
      KONG_PG_PASSWORD: kong_secret
    networks:
      - taskflow
    depends_on:
      kong-database:
        condition: service_healthy
    restart: on-failure

  kong:
    image: kong:3.6
    container_name: taskflow-kong
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-database
      KONG_PG_USER: kong
      KONG_PG_PASSWORD: kong_secret
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      KONG_ADMIN_GUI_URL: http://localhost:8002
    ports:
      - '8000:8000' # Kong Proxy (Frontend এখানে হিট করবে)
      - '8001:8001' # Kong Admin API (CLI/UI থেকে কনফিগার করব)
      - '8443:8443' # Kong Proxy SSL
      - '8444:8444' # Kong Admin SSL
    networks:
      - taskflow
    depends_on:
      kong-migrations:
        condition: service_completed_successfully

  konga:
    image: pantsel/konga:latest
    container_name: taskflow-konga
    environment:
      NODE_ENV: production
      DB_ADAPTER: postgres
      DB_HOST: kong-database
      DB_USER: kong
      DB_PASSWORD: kong_secret
      DB_DATABASE: konga
    ports:
      - '1337:1337' # Konga UI
    networks:
      - taskflow
    depends_on:
      kong:
        condition: service_started
